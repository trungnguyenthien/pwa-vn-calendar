<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Calendar Body -->
  <rect x="76" y="80" width="360" height="360" rx="48" fill="#1e293b" stroke="#334155" stroke-width="4" />

  <!-- Calendar Header -->
  <path d="M 76 128 A 48 48 0 0 1 124 80 L 388 80 A 48 48 0 0 1 436 128 L 436 180 L 76 180 Z" fill="url(#headerGrad)" />

  <!-- Rings -->
  <rect x="156" y="60" width="24" height="44" rx="12" fill="#f8fafc" />
  <rect x="332" y="60" width="24" height="44" rx="12" fill="#f8fafc" />

  <!-- Moon & Sun Motif -->
  <!-- Crescent Moon -->
  <path d="M 230 220 A 70 70 0 1 0 320 330 A 85 85 0 1 1 230 220 Z" fill="url(#moonGrad)" filter="url(#glow)" />

  <!-- Star / Sun Sparkle -->
  <circle cx="340" cy="245" r="14" fill="#fbbf24" />
  <circle cx="370" cy="290" r="8" fill="#fde68a" />

  <!-- Calendar Dots -->
  <circle cx="150" cy="385" r="10" fill="#e11d48" />
  <circle cx="205" cy="385" r="10" fill="#94a3b8" />
  <circle cx="260" cy="385" r="10" fill="#94a3b8" />
  <circle cx="315" cy="385" r="10" fill="#94a3b8" />
  <circle cx="370" cy="385" r="10" fill="#38bdf8" />
</svg>
